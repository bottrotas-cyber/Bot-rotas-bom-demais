services:
  - type: web
    name: bot-whatsapp-painel
    env: docker
    plan: 8c-32g
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "10000"
      - key: OCR_GLOBAL_CONCURRENCY
        value: "8"
      - key: OCR_TURBO_MODE
        value: "true"
      - key: OCR_VARIANT_CONCURRENCY
        value: "4"
      - key: UV_THREADPOOL_SIZE
        value: "16"
      - key: BOT_PERFORMANCE_PROFILE
        value: high
      - key: BOT_EAGER_WORKERS
        value: "true"
      - key: PANEL_USERS
        sync: false
      - key: PANEL_ADMIN_EMAILS
        sync: false
      - key: PANEL_SESSION_SECRET
        sync: false
      - key: KEEP_ALIVE_URL
        sync: false
      - key: KEEP_ALIVE_WHEN_MONITORING
        value: "false"
      - key: DAILY_SESSION_RESET_ENABLED
        value: "false"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BACKUP_ENCRYPTION_KEY
        sync: false
      - key: R2_BACKUP_INTERVAL_MINUTES
        value: "15"
      - key: R2_BACKUP_RETENTION_DAYS
        value: "30"
    disk:
      name: bot-whatsapp-data
      mountPath: /data
      sizeGB: 5
